[project]
name = "galaxysim"
version = "0.1.0"
description = "Async, persistent, text-based multiplayer civilization/universe simulation"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
galaxysim = "galaxysim.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["galaxysim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run across cores by default. The suite is dominated by tests that simulate
# hundreds of ticks, they share nothing (each builds its own in-memory
# database), and waiting four minutes to find out a change is fine is how a
# suite stops being run. `-p no:randomly`-style ordering concerns do not apply:
# determinism here comes from seeds, not from test order.
addopts = "-n auto"
